<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>今晚煮什麼</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one column of working panels under a 4-stop stepper (設定 → 菜單 → 採買 → 下廚).
   Prices show as yellow shelf tags; the shopping list is set like a till receipt. */
:root{
  --bg:#e9efec; --surface:#fbfdfc; --ink:#15221d; --muted:#566962; --line:#c9d6d0;
  --accent:#1b7758; --accent-ink:#ffffff; --accent-soft:#d8ebe3;
  --tag:#ffd630; --tag-ink:#b9221a; --warn:#a93b0c; --warn-soft:#fbe6da;
  --flame:#ee7325; --steel:#b3c2bb; --wood:#d4ab78; --veg:#4d9e58; --water:#84c3d5;
  --c-pro:#1b7758; --c-fat:#d9990f; --c-carb:#4a7dcc;
  --f-display:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --f-body:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --f-num:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#17211e; --ink:#e4eeea; --muted:#98ada5; --line:#2a3934;
  --accent:#5cc79f; --accent-ink:#06201a; --accent-soft:#1d3a30;
  --tag:#f3c91c; --tag-ink:#8c150e; --warn:#f0946a; --warn-soft:#3a2219;
  --flame:#f58a45; --steel:#5d6e68; --wood:#8a6a44; --veg:#62b56d; --water:#4f97ab;
  --c-pro:#5cc79f; --c-fat:#e6b33c; --c-carb:#7ea6ea; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#17211e; --ink:#e4eeea; --muted:#98ada5; --line:#2a3934;
  --accent:#5cc79f; --accent-ink:#06201a; --accent-soft:#1d3a30;
  --tag:#f3c91c; --tag-ink:#8c150e; --warn:#f0946a; --warn-soft:#3a2219;
  --flame:#f58a45; --steel:#5d6e68; --wood:#8a6a44; --veg:#62b56d; --water:#4f97ab;
  --c-pro:#5cc79f; --c-fat:#e6b33c; --c-carb:#7ea6ea; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px 120px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p{margin:0}
h1{font-family:var(--f-display);font-size:30px;line-height:1.2;letter-spacing:.02em}
h2{font-family:var(--f-display);font-size:18px;line-height:1.3;text-wrap:balance}
h3{font-size:16px;font-weight:700;line-height:1.35}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
.top p{color:var(--muted);max-width:34em}
.term{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 12px;background:var(--surface);white-space:nowrap}
.term b{color:var(--accent)}

.steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--bg);padding-block:6px}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:500;min-width:0}
.steps button i{font-style:normal;font-family:var(--f-num);font-weight:700;font-size:17px;color:var(--muted)}
.steps button[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps button[aria-current="step"] i{color:inherit}

#view{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel > header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}

.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);display:flex;flex-direction:column;line-height:1.3;cursor:pointer;min-width:0}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt b{font-weight:700}.opt small{color:var(--muted);font-size:12px}
.opt:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.opt:has(input:checked) b{color:var(--accent)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}

.budget{display:flex;align-items:center;gap:12px}
.budget input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.big{font-family:var(--f-num);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.note b{color:var(--accent)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px}
ul.tips{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}

.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 16px;font-weight:700;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 12px;font-size:14px}
.btn.on{background:var(--accent-soft);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{border:0;background:none;color:var(--accent);text-decoration:underline;padding:0;font-size:13px}

.tag{display:inline-flex;align-items:baseline;gap:1px;background:var(--tag);color:var(--tag-ink);font-family:var(--f-num);font-weight:700;font-size:22px;line-height:1;padding:4px 8px 5px;border-radius:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag small{font-size:12px;font-family:var(--f-body);font-weight:700}
.chip{display:inline-block;font-size:12px;line-height:1.5;border-radius:999px;padding:0 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.hit{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:700}
.chip.ai{border-color:var(--c-carb);color:var(--c-carb)}

.cards{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card{grid-template-columns:72px 1fr auto}
.thumb{width:72px;height:72px;border-radius:12px;background:var(--bg);display:grid;place-items:center;overflow:hidden}
.thumb svg,.hero svg{width:100%;height:100%;display:block}
.hero{height:150px;border-radius:12px;background:var(--bg);display:grid;place-items:center;overflow:hidden}
.hero svg{width:auto;height:100%;aspect-ratio:1}
@media (max-width:420px){.card{grid-template-columns:56px 1fr auto}.thumb{width:56px;height:56px}}
.card.picked{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.card.dim{opacity:.6}
.card-main{min-width:0;display:flex;flex-direction:column;gap:4px;text-align:left;border:0;background:none;padding:0}
.card-main h3{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.card-main .meta{color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.card-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .lbl{font-size:12px;color:var(--muted)}
.stat .val{font-family:var(--f-num);font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .val small{font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.meter.over i{background:var(--warn)}

.macro{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.macro i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--k)}
table.nt{width:100%;border-collapse:collapse;font-size:14px}
table.nt td{padding:5px 0;border-top:1px solid var(--line);vertical-align:middle}
table.nt td:nth-child(2){text-align:right;font-family:var(--f-num);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;padding-right:10px;white-space:nowrap}
table.nt td:nth-child(3){width:38%}
table.nt td:nth-child(4){text-align:right;width:3.2em;color:var(--muted);font-size:12px}
table.ing{width:100%;border-collapse:collapse;font-size:14px}
table.ing td{padding:4px 0;border-top:1px dashed var(--line)}
table.ing td:last-child{text-align:right;white-space:nowrap}
ol.plain{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}

dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(8,16,13,.55)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:14px}
.dlg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dlg-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface);padding-top:8px}
.x{border:1px solid var(--line);background:var(--bg);border-radius:50%;width:34px;height:34px;flex:none;font-size:18px;line-height:1}
.kcal{display:flex;align-items:baseline;gap:6px}

.receipt{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:18px 16px;display:flex;flex-direction:column;gap:10px;border-top:3px dashed var(--line);border-bottom:3px dashed var(--line)}
.receipt h2{text-align:center}
.receipt .head{text-align:center;color:var(--muted);font-size:13px}
.grp{font-size:12px;letter-spacing:.2em;color:var(--muted);border-bottom:1px dashed var(--line);padding-top:6px}
.row{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 10px;align-items:center}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin:0}
.row .nm{min-width:0}
.row .nm b{font-weight:500}
.row .nm small{display:block;color:var(--muted);font-size:12px;line-height:1.5}
.row .nm a{color:var(--accent)}
.row.off .nm b{text-decoration:line-through;color:var(--muted)}
.row.off .sub{color:var(--muted)}
.pin{display:inline-flex;align-items:center;gap:2px;background:var(--tag);color:var(--tag-ink);border-radius:3px;padding:0 6px;font-family:var(--f-num);font-weight:700}
.pin input{width:3.2em;border:0;background:transparent;color:inherit;font:inherit;font-size:18px;text-align:right;padding:2px 0;-moz-appearance:textfield;font-variant-numeric:tabular-nums}
.pin input::-webkit-outer-spin-button,.pin input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.row .sub{font-family:var(--f-num);font-weight:700;font-size:18px;min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.src{font-size:11px;border-radius:3px;padding:0 4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.src.real{border-color:var(--accent);color:var(--accent)}
.src.own{border-color:var(--c-carb);color:var(--c-carb)}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);padding-top:8px;font-weight:700}
.total .num{font-size:30px;font-weight:700}
details summary{cursor:pointer;font-weight:500}
textarea.copy{width:100%;min-height:160px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:13px/1.5 var(--f-body);padding:8px}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.player{display:block}
.anim{background:var(--bg);border-radius:14px;aspect-ratio:8/5;max-width:100%;display:grid;place-items:center;overflow:hidden}
.anim svg{width:100%;height:100%;display:block}
.stepno{font-size:13px;color:var(--muted);letter-spacing:.08em}
.steptext{font-size:19px;line-height:1.6;font-weight:500}
.timer{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.timer .num{font-size:34px;font-weight:700;line-height:1}
.timer.done .num{color:var(--warn)}
.stepnav{display:flex;gap:8px}
.stepnav .btn{flex:1}
ol.all{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
ol.all button{width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:6px 8px;display:grid;grid-template-columns:3.4em 1fr;gap:8px;color:var(--muted)}
ol.all button[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
ol.all button span:first-child{font-size:12px;color:var(--accent);font-weight:700;padding-top:2px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar > div{max-width:828px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar p{font-size:13px;color:var(--muted);min-width:0}
.bar p b{color:var(--ink)}
.bar p b.over{color:var(--warn)}

/* step animations */
.anim svg *{transform-box:fill-box}
.f-ink{fill:var(--ink)}.f-acc{fill:var(--accent)}.f-tag{fill:var(--tag)}.f-surf{fill:var(--surface)}.f-steel{fill:var(--steel)}
.f-wood{fill:var(--wood)}.f-veg{fill:var(--veg)}.f-car{fill:var(--flame)}.f-flame{fill:var(--flame)}.f-water{fill:var(--water)}
.st{fill:none;stroke:var(--muted);stroke-width:4;stroke-linecap:round}
.st-ink{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.st-fl{fill:none;stroke:var(--flame);stroke-width:3;stroke-linecap:round}
.knife{animation:chop .45s ease-in infinite alternate}
@keyframes chop{to{transform:translateY(24px)}}
.sl rect{animation:pop 1.8s steps(1) infinite}
.sl rect:nth-child(2){animation-delay:.45s}.sl rect:nth-child(3){animation-delay:.9s}
@keyframes pop{0%{opacity:0}25%,100%{opacity:1}}
.flames path{transform-origin:50% 100%;animation:flick .4s ease-in-out infinite alternate}
.flames path:nth-child(2){animation-delay:.15s}.flames path:nth-child(3){animation-delay:.3s}
@keyframes flick{to{transform:scaleY(.55)}}
.bits circle{animation:toss .5s ease-out infinite alternate}
.bits circle:nth-child(2){animation-delay:.12s}.bits circle:nth-child(3){animation-delay:.24s}.bits circle:nth-child(4){animation-delay:.36s}
@keyframes toss{to{transform:translateY(-28px)}}
.bub circle{animation:bub 1.2s ease-in infinite}
.bub circle:nth-child(2){animation-delay:.4s}.bub circle:nth-child(3){animation-delay:.8s}
@keyframes bub{0%{transform:translateY(10px) scale(.3);opacity:0}40%{opacity:1}100%{transform:translateY(-12px) scale(1);opacity:0}}
.steam path{animation:steam 2s linear infinite}
.steam path:nth-child(2){animation-delay:.6s}.steam path:nth-child(3){animation-delay:1.2s}
@keyframes steam{0%{transform:translateY(10px);opacity:0}40%{opacity:.85}100%{transform:translateY(-12px);opacity:0}}
.lamp{fill:var(--flame);animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.glow{fill:var(--flame);animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.25}to{opacity:.9}}
.fan{transform-origin:center;animation:spin .9s linear infinite}
.hand{transform-origin:50% 100%;animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dish{transform-origin:center;animation:wob 1.6s ease-in-out infinite alternate}
@keyframes wob{from{transform:scaleX(1)}to{transform:scaleX(.55)}}
.stir{transform-origin:50% 100%;animation:stir 1s ease-in-out infinite alternate}
@keyframes stir{from{transform:translateX(-22px) rotate(-10deg)}to{transform:translateX(22px) rotate(10deg)}}
.drops circle{animation:drop .9s ease-in infinite}
.drops circle:nth-child(2){animation-delay:.3s}.drops circle:nth-child(3){animation-delay:.6s}
@keyframes drop{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(42px);opacity:0}}
.spark{transform-origin:center;animation:tw 1s ease-in-out infinite alternate}
@keyframes tw{from{transform:scale(.3);opacity:.3}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.anim svg *{animation:none!important}}

/* photos, forms */
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.hero{height:210px}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero svg{width:auto;height:100%}
.credit{font-size:11px;color:var(--muted);line-height:1.5}
.credit a{color:inherit}
.anim img{width:100%;height:100%;object-fit:cover;display:block;animation:kb 9s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08)}}
.uprow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld > span{font-size:13px;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px 10px;min-width:0}
textarea.inp{min-height:130px;line-height:1.6;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 84px 34px;gap:6px;align-items:center}
.irow .cust{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;background:var(--accent-soft);border-radius:8px;padding:8px}
.irow .cust[hidden]{display:none}
.credits summary{font-size:13px;color:var(--muted)}
.credits ul{margin:8px 0 0;padding-left:1.2em;font-size:12px;color:var(--muted)}

/* ---- responsive: phone / tablet ---- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.wrap{overflow-x:clip}
svg,img,table,textarea,input,select{max-width:100%}
.panel,.card,.receipt,.row .nm,.opts,.stepnav,.timer{min-width:0}
.steptext,.card-main,.note,.warnbox,.receipt{overflow-wrap:anywhere}
table.nt,table.ing{display:block;overflow-x:auto}
dialog{max-height:calc(100dvh - 24px)}
dialog .dlg{max-height:calc(100dvh - 26px);overflow-y:auto;overscroll-behavior:contain}
dialog .dlg > *{flex-shrink:0}
@media (pointer:coarse){
  .btn,.stepper button,.tabs button,.x{min-height:44px}
  .btn.sm{min-height:40px}
  .row input[type=checkbox]{width:24px;height:24px}
  .steps button{min-height:44px}
}
/* tablet */
@media (min-width:700px){
  .wrap{max-width:1040px;padding-inline:28px;gap:20px}
  h1{font-size:34px}
  .panel{padding:20px}
  .trio{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .steptext{font-size:21px}
  .stores{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .bar > div{max-width:984px}
  dialog{width:min(720px,calc(100vw - 48px))}
}
@media (min-width:1000px){
  .cards{grid-template-columns:repeat(3,minmax(0,1fr))}
}
/* phone */
@media (max-width:520px){
  .wrap{padding-inline:16px;padding-block:14px 132px;gap:12px}
  h1{font-size:25px}
  .top p{font-size:14px}
  .panel{padding:14px;border-radius:12px}
  .steps{gap:3px}

const KEY = 'cook-tonight-v1';
const S = {mine:[],photos:{},customIng:[],store:'px',budget:500,people:2,time:45,tools:['wok','pot','dianguo'],goals:[],picked:null,manual:false,skip:{},need:{},price:{},view:'setup',ai:[],cook:null,step:0};
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
(S.customIng || []).forEach(x => { ING[x.id] = x; });
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const all = () => R.concat(S.mine || [], S.ai || []);
const byId = id => all().find(r => r.id === id);
const picked = () => (S.picked || []).map(byId).filter(Boolean);
const store = () => STORES.find(s => s.id === S.store) || STORES[0];
const toolName = id => (TOOLS.find(t => t.id === id) || {}).n || id;

function price(ing){ const o = S.price[S.store+':'+ing.id]; if (o > 0) return o; const st = store(); return Math.max(1, Math.round(ing.p * (st.f[ing.cat] || 1) * (st.mul || 1))); }
const packG = ing => ing.g * (store().mul || 1);
const srcOf = ing => S.price[S.store+':'+ing.id] > 0 ? 'own' : (S.store === 'wjf' && ing.r ? 'real' : 'est');
const costPer = r => r.ing.reduce((a,[id,g]) => a + g * price(ING[id]) / packG(ING[id]), 0);
function shop(list){
  const agg = {};
  list.forEach(r => r.ing.forEach(([id,g]) => { agg[id] = (agg[id] || 0) + g * S.people; }));
  const rows = Object.keys(agg).map(id => { const ing = ING[id], packs = Math.ceil(agg[id] / packG(ing) - 1e-9), p = price(ing);
    return {ing, need:agg[id], packs, p, sub:packs*p, on: ing.st ? !!S.need[id] : !S.skip[id]}; });
  return {rows, total: rows.reduce((a,x) => a + (x.on ? x.sub : 0), 0)};
}
const menuTime = list => list.length ? Math.max(Math.max(...list.map(r => r.min)), list.reduce((a,r) => a + r.act, 0)) : 0;
const fits = r => r.min <= S.time && r.tools.some(t => S.tools.includes(t));
function why(r){ if (!r.tools.some(t => S.tools.includes(t))) return '需要' + r.tools.map(toolName).join('或'); if (r.min > S.time) return '要 ' + r.min + ' 分鐘'; return ''; }
function score(r){ let s = 0; S.goals.forEach(g => { if (r.tags.includes(g)) s += 10; }); if (r.tags.includes(SEASON.tag)) s += 2; return s - costPer(r) / 40; }
function autoPick(){
  const el = all().filter(fits).sort((a,b) => score(b) - score(a)), out = [];
  const ok = r => { const t = out.concat(r); return menuTime(t) <= S.time && shop(t).total <= S.budget; };
  const add = cats => { const r = el.find(x => cats.includes(x.cat) && !out.includes(x) && ok(x)); if (r) out.push(r); return r; };
  let main = add(['main','bowl']);
  if (!main) { main = el.filter(r => r.cat === 'main' || r.cat === 'bowl').sort((a,b) => costPer(a) - costPer(b))[0]; if (main) out.push(main); }
  add(['side']);
  if (S.people >= 2) add(['soup']);
  if (main && main.cat !== 'bowl') add(['staple']);
  if (S.people >= 4) add(['side','main']);
  S.picked = out.map(r => r.id);
}

}

/* 顯示格式 */
const frac = n => { const w = Math.floor(n), f = Math.round((n - w) * 4); return (w || !f ? w : '') + ['', '¼', '½', '¾'][f]; };
const gr = g => g >= 1000 ? (g/1000).toFixed(1) + 'kg' : g < 10 ? Math.max(1, Math.round(g)) + 'g' : g < 100 ? Math.round(g/5)*5 + 'g' : Math.round(g/10)*10 + 'g';
function qty(ing, g){
  if (ing.sp) { const t = g / ing.sp; if (t < .2) return '少許'; if (t >= 2.75) return frac(Math.round(t/3*2)/2) + ' 大匙'; return frac(Math.max(.25, Math.round(t*4)/4)) + ' 小匙'; }
  if (ing.u) { return frac(Math.max(.5, Math.round(g / ing.u[1] * 2) / 2)) + ' ' + ing.u[0]; }

  if (!o || typeof o.name !== 'string') return null;
  const ing = (Array.isArray(o.ing) ? o.ing : []).filter(x => Array.isArray(x) && ING[x[0]] && +x[1] > 0 && +x[1] < 2000).map(x => [x[0], +x[1]]);
  const steps = (Array.isArray(o.steps) ? o.steps : []).filter(s => s && typeof s.s === 'string').slice(0,10).map(s => ({a: SC[s.a] ? s.a : 'mix', s: s.s.slice(0,200), t: +s.t > 0 ? Math.min(7200, Math.round(+s.t)) : 0}));
  if (!ing.length || !steps.length) return null;
  const tools = (Array.isArray(o.tools) ? o.tools : []).filter(t => TOOLS.some(x => x.id === t));
  return {id:'ai' + Date.now().toString(36) + Math.random().toString(36).slice(2,6), ai:1, n:o.name.slice(0,24), cat: CATS[o.cat] ? o.cat : 'main', min: clamp(Math.round(+o.min) || 30, 5, 180), act: clamp(Math.round(+o.active) || 10, 1, 120), tools: tools.length ? tools : ['wok'], tags: (Array.isArray(o.tags) ? o.tags : []).filter(t => GOALS.some(g => g.id === t)), note: String(o.note || '').slice(0,120), ing, steps};
}
async function askAI(){
  if (!AI || aiCtl) return;
  aiCtl = new AbortController(); aiMsg = 'Claude 思考中，大約要 20–60 秒…'; render();
  const prompt = '你是台灣家常菜的食譜顧問。請依下列條件設計 3 道新的家常菜，只回傳一個 JSON 陣列，不要有其他文字。\n'+
    '條件：'+S.people+' 人吃；每道 '+S.time+' 分鐘內完成；可用廚具：'+S.tools.join(',')+'；膳食療養目標：'+(S.goals.join(',') || '無')+'；現在節氣：'+TERM[2]+'。\n'+
    '不要和這些菜重複：'+all().map(r => r.n).join('、')+'。\n'+
    '只能使用這些食材（id=名稱），份量單位是每人份公克：'+Object.values(ING).map(i => i.id+'='+i.n).join('，')+'。\n'+
    '每道的格式：{"name":"菜名","cat":"main|side|soup|bowl","min":總分鐘數,"active":動手分鐘數,"tools":["任一樣就能完成的廚具id"],"tags":["符合的目標id"],"note":"一句繁體中文食療說明","ing":[["食材id",每人份公克]],"steps":[{"a":"動作id","s":"繁體中文步驟說明","t":需要計時的秒數或0}]}\n'+
    '動作id：'+Object.keys(ACT).join(',')+'。廚具id：'+TOOLS.map(t => t.id).join(',')+'。目標id：'+GOALS.map(g => g.id+'='+g.n).join(',')+'。';
  try {
    const out = await AI.json(prompt, {signal: aiCtl.signal, cache: false});
    const list = (Array.isArray(out) ? out : []).map(cleanAI).filter(Boolean).slice(0,3);
    if (list.length) { S.ai = (S.ai || []).concat(list).slice(-9); aiMsg = '加了 ' + list.length + ' 道：' + list.map(r => r.n).join('、') + '。'; }
    else aiMsg = '這次沒拿到可用的食譜，再按一次試試。';
  } catch (e) {
    const c = e && e.code;
    if (['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)) { AI = null; aiMsg = ''; }
    else aiMsg = c === 'cancelled' ? '' : c === 'rate_limited' ? '你的 Claude 用量暫時到上限了，晚點再試。' : c === 'session_expired' ? '登入已過期，重新登入後再試。' : c === 'invalid_json' || c === 'empty_completion' ? '回覆的格式不對，再按一次試試。' : c === 'refused' ? 'Claude 沒有回答這個要求，換個條件再試。' : '連線中斷了，再按一次試試。';
  }
  aiCtl = null; render();
}


const frm = $('#frm');
function ingOptions(){
  const g = {m:'肉品海鮮',e:'蛋豆',v:'蔬果',d:'乾貨雜糧',s:'調味料'};
  return '<option value="">選食材…</option>'+Object.keys(g).map(c => '<optgroup label="'+g[c]+'">'+Object.values(ING).filter(i => i.cat === c && !i.custom).map(i => '<option value="'+i.id+'">'+i.n+'</option>').join('')+'</optgroup>').join('')+
    ((S.customIng || []).length ? '<optgroup label="我加的食材">'+S.customIng.map(i => '<option value="'+i.id+'">'+esc(i.n)+'</option>').join('')+'</optgroup>' : '')+'<option value="__new">＋ 其他（自己輸入）</option>';
}
function irow(){
  return '<div class="irow"><select class="inp isel" aria-label="食材">'+ingOptions()+'</select><input class="inp ig" type="number" inputmode="decimal" min="0" placeholder="每人克數" aria-label="每人克數"><button type="button" class="x" data-act="delrow" aria-label="移除這列">×</button>'+
    '<div class="cust" hidden><input class="inp cn" placeholder="食材名稱" aria-label="食材名稱"><input class="inp ck" type="number" inputmode="decimal" min="0" placeholder="熱量/100g" aria-label="每100克熱量大卡"><input class="inp cpr" type="number" inputmode="decimal" min="0" placeholder="蛋白質g/100g" aria-label="蛋白質"><input class="inp cf" type="number" inputmode="decimal" min="0" placeholder="脂肪g/100g" aria-label="脂肪"><input class="inp cc" type="number" inputmode="decimal" min="0" placeholder="碳水g/100g" aria-label="碳水"><input class="inp cp" type="number" inputmode="decimal" min="0" placeholder="約幾元/100g" aria-label="每100克價格"></div></div>';
}
function openForm(){
  frm.innerHTML = '<form class="dlg" id="frmf" onsubmit="return false"><div class="dlg-head"><h2 style="font-size:22px">新增我的食譜</h2><button type="button" class="x" data-act="closefrm" aria-label="關閉">×</button></div>'+
    '<label class="fld"><span>菜名</span><input class="inp" id="f-name" maxlength="24" placeholder="例如：媽媽的滷肉飯"></label>'+
    '<div class="frow"><label class="fld"><span>類型</span><select class="inp" id="f-cat">'+Object.keys(CATS).map(k => '<option value="'+k+'">'+CATS[k]+'</option>').join('')+'</select></label><label class="fld"><span>全部要幾分鐘</span><input class="inp" id="f-min" type="number" inputmode="numeric" min="5" value="30"></label><label class="fld"><span>其中動手幾分鐘</span><input class="inp" id="f-act" type="number" inputmode="numeric" min="1" value="15"></label></div>'+
    '<div class="fld"><span>需要的廚具（任選一樣就能做的都勾）</span><div class="opts">'+TOOLS.map(t => '<label class="opt"><input type="checkbox" name="f-tool" value="'+t.id+'"><b>'+t.n+'</b></label>').join('')+'</div></div>'+
    '<div class="fld"><span>符合的膳食療養目標（選填）</span><div class="opts">'+GOALS.map(g => '<label class="opt"><input type="checkbox" name="f-goal" value="'+g.id+'"><b>'+g.n+'</b></label>').join('')+'</div></div>'+
    '<div class="fld"><span>食材（每人份的量，採買時會乘以人數）</span><div id="f-ings" style="display:flex;flex-direction:column;gap:8px">'+irow()+irow()+irow()+'</div><button type="button" class="btn ghost sm" data-act="addrow" style="align-self:flex-start">＋ 多一種食材</button><span class="small muted">選「其他」可輸入自己的食材，營養和價格不確定可以留空，留空的部分不會計入。</span></div>'+
    '<label class="fld"><span>做法（一行一個步驟，寫「煮 10 分鐘」之類會自動出現計時器）</span><textarea class="inp" id="f-steps" placeholder="切好洗淨\n熱鍋下油炒香\n加水煮 10 分鐘"></textarea></label>'+
    '<label class="fld"><span>一句話備註（選填）</span><input class="inp" id="f-note" maxlength="120" placeholder="例如：外婆教的，多放一點白胡椒"></label>'+
    '<div class="fld"><span>成品照片（選填）</span><input type="file" accept="image/*" id="f-photo"></div>'+
    '<p class="warnbox" id="f-err" hidden></p>'+
    '<div class="dlg-foot"><button type="button" class="btn ghost" data-act="closefrm">取消</button><button type="button" class="btn" data-act="saverecipe">加進菜單</button></div></form>';
  frm.showModal(); frm.scrollTop = 0;
}
async function saveRecipe(){
  const err = m => { const e = $('#f-err'); e.textContent = m; e.hidden = false; e.scrollIntoView({block:'nearest'}); };
  const name = $('#f-name').value.trim(); if (!name) return err('請填菜名。');
  const ing = [], news = [];
  for (const row of frm.querySelectorAll('.irow')) {
    const sel = row.querySelector('.isel').value, g = +row.querySelector('.ig').value; if (!sel && !g) continue;
    if (!sel || !(g > 0)) return err('每一列食材都要選食材並填克數。');
    if (sel === '__new') {
      const n = row.querySelector('.cn').value.trim(); if (!n) return err('自己輸入的食材要填名稱。');
      const v = c => Math.max(0, +row.querySelector(c).value || 0), id = 'c' + Date.now().toString(36) + news.length;
      const o = {id, n, cat:'v', g:100, pk:'100g', p: Math.max(1, Math.round(v('.cp')) || 20), r:0, st:0, k:v('.ck'), pr:v('.cpr'), f:v('.cf'), c:v('.cc'), fb:0, na:0, custom:1};
      news.push(o); ing.push([id, g]);
    } else ing.push([sel, g]);
  }
  if (!ing.length) return err('至少要有一種食材。');
  const steps = parseSteps($('#f-steps').value); if (!steps.length) return err('請寫下做法。');
  news.forEach(o => { ING[o.id] = o; S.customIng.push(o); });
  const tools = [...frm.querySelectorAll('input[name=f-tool]:checked')].map(x => x.value);
  const r = {id:'my' + Date.now().toString(36), mine:1, n:name, cat:$('#f-cat').value, min:clamp(Math.round(+$('#f-min').value) || 30, 5, 600), act:clamp(Math.round(+$('#f-act').value) || 10, 1, 600), tools: tools.length ? tools : TOOLS.map(t => t.id), tags:[...frm.querySelectorAll('input[name=f-goal]:checked')].map(x => x.value), note:$('#f-note').value.trim(), ing, steps};
  const f = $('#f-photo').files[0];
  if (f) { try { S.photos[r.id] = await resizeImg(f); } catch (e) { return err('這張照片打不開，換一張試試。'); } }
  S.mine.push(r); S.picked = (S.picked || []).concat(r.id); S.manual = true;
  frm.close(); render();
}

/* 事件 */
function go(v){ S.view = v; render(); window.scrollTo(0, 0); if (v === 'cook') { try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {} } }
function toggle(id){ S.picked = S.picked || []; const i = S.picked.indexOf(id); if (i >= 0) S.picked.splice(i, 1); else S.picked.push(id); S.manual = true; }
const dlg = $('#dlg');
document.addEventListener('click', e => {
  if (e.target === dlg) { dlg.close(); return; }
  if (e.target === frm) { frm.close(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a === 'view') { if (dlg.open) dlg.close(); go(b.dataset.v); }
  else if (a === 'people') { S.people = clamp(S.people + (+b.dataset.d), 1, 8); if (!S.manual) S.picked = null; render(); }
  else if (a === 'auto') { S.manual = false; const before = (S.picked || []).join(); autoPick(); if ((S.picked || []).join() === before) { const el = all().filter(fits); const alt = el.filter(r => (r.cat === 'main' || r.cat === 'bowl') && !S.picked.includes(r.id)).sort((x,y) => score(y) - score(x))[0]; const i = S.picked.findIndex(p => ['main','bowl'].includes((byId(p) || {}).cat)); if (alt && i >= 0) S.picked[i] = alt.id; } render(); }
  else if (a === 'pick') { toggle(id); if (dlg.open) dlg.innerHTML = detail(byId(id)); render(); }
  else if (a === 'open') { const r = byId(id); if (r) { dlg.innerHTML = detail(r); if (!dlg.open) dlg.showModal(); dlg.scrollTop = 0; } }
  else if (a === 'close') dlg.close();
  else if (a === 'cookit') { dlg.close(); S.cook = id; S.step = 0; go('cook'); }
  else if (a === 'cooktab') { S.cook = id; S.step = 0; render(); }
  else if (a === 'step') { S.step += +b.dataset.d; render(); }
  else if (a === 'goto') { S.step = +b.dataset.i; render(); window.scrollTo(0, 0); }
  else if (a === 'timer') {
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {}
    if (timer.int) { clearInterval(timer.int); timer.int = null; }
    else { if (timer.done || !timer.left) { const r = byId(S.cook); timer.left = r.steps[S.step].t; timer.done = false; } timer.int = setInterval(tick, 1000); }
    render();
  }
  else if (a === 'copy') {
    const sh = shop(picked()), txt = '採買清單（' + store().n + '，' + S.people + ' 人份）\n' + sh.rows.filter(x => x.on).map(x => '□ ' + x.ing.n + ' ' + (store().mul ? '大包裝' : x.ing.pk) + ' × ' + x.packs + '　' + money(x.sub)).join('\n') + '\n合計 ' + money(sh.total);
    const box = $('#copyBox'), done = () => { b.textContent = '已複製'; };
    const fb = () => { box.hidden = false; box.value = txt; box.focus(); box.select(); b.textContent = '請手動複製下方文字'; };
    try { navigator.clipboard.writeText(txt).then(done, fb); } catch (err) { fb(); }
  }
  else if (a === 'resetprice') { S.price = {}; render(); }
  else if (a === 'newrecipe') openForm();
  else if (a === 'closefrm') frm.close();
  else if (a === 'addrow') $('#f-ings').insertAdjacentHTML('beforeend', irow());
  else if (a === 'delrow') { const rows = frm.querySelectorAll('.irow'); if (rows.length > 1) b.closest('.irow').remove(); }
  else if (a === 'saverecipe') saveRecipe();
  else if (a === 'rmphoto') { delete S.photos[id]; dlg.innerHTML = detail(byId(id)); render(); }
  else if (a === 'delrecipe') { S.mine = (S.mine || []).filter(r => r.id !== id); S.ai = (S.ai || []).filter(r => r.id !== id); S.picked = (S.picked || []).filter(p => p !== id); delete S.photos[id]; if (S.cook === id) S.cook = null; dlg.close(); render(); }
  else if (a === 'ai') askAI();
  else if (a === 'aistop') { if (aiCtl) aiCtl.abort(); }
  else if (a === 'aiclear') { const ids = (S.ai || []).map(r => r.id); S.ai = []; S.picked = (S.picked || []).filter(p => !ids.includes(p)); aiMsg = ''; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'budget') { S.budget = +e.target.value; $('#budgetOut').textContent = money(S.budget); $('#perHead').textContent = '平均每人 ' + money(S.budget / S.people); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('isel')) { t.closest('.irow').querySelector('.cust').hidden = t.value !== '__new'; return; }
  if (t.id === 'up-photo') { const f = t.files[0], id = t.dataset.id; if (f) resizeImg(f).then(u => { S.photos[id] = u; dlg.innerHTML = detail(byId(id)); render(); }).catch(() => {}); return; }
  const auto = () => { if (!S.manual) S.picked = null; };
  if (t.id === 'budget') { S.budget = +t.value; auto(); render(); }
  else if (t.name === 'store') { S.store = t.value; auto(); render(); }
  else if (t.name === 'time') { S.time = +t.value; auto(); render(); }
  else if (t.name === 'tool') { S.tools = [...document.querySelectorAll('input[name=tool]:checked')].map(x => x.value); auto(); render(); }
  else if (t.name === 'goal') { S.goals = [...document.querySelectorAll('input[name=goal]:checked')].map(x => x.value); auto(); render(); }
  else if (t.dataset.ing) { const ing = ING[t.dataset.ing]; if (ing.st) S.need[ing.id] = t.checked; else S.skip[ing.id] = !t.checked; render(); }
  else if (t.dataset.price) { const v = Math.round(+t.value), k = S.store + ':' + t.dataset.price; if (v > 0) S.price[k] = v; else delete S.price[k]; render(); }
});
$('#credits').innerHTML = '<summary>照片來源與授權</summary><ul>'+Object.keys(PH).filter(k => k.indexOf('a_') !== 0).map(k => { const label = (byId(k) && byId(k).n) || ACT[k.replace(/^a_/, '')] || k; return '<li>'+esc(label)+'：'+creditOf(k).replace('照片：','')+'</li>'; }).join('')+'</ul><p class="credit">部分照片來自 Wikimedia Commons，依各自創用 CC 授權使用；其餘為生成之料理示範圖。</p>';
render();
</script>
